main: 

  - title: Operator Spreading Toolbox 
    description: > 
      A Python implementation of the operator-growth dynamics in fully-connected quantum spin models, with focus on the LMG model. [Will be released soon]
    image: /assets/img/softwares/probability_animation.gif
    github: https://github.com/nicolasdero/OperatorSpreadingLMG
    useful: >
      The code contains the necessary functions to evolve an operator in the <strong>Heisenberg picture</strong> for a generic Hamiltonian and to compute the <strong>operator growth 
      (or operator size)</strong> and the <strong>Pauli weight probability distribution</strong> from scratch. For systems with permutation-invariance symmetry, it shows how operators 
      can be efficiently <strong>evolved in the OTSS space</strong>, although the implementation is restricted to the LMG model and its kicked version. It also contains a function to 
      construct the full <strong>eigenoperator basis</strong> of the OTSS space. At the classical level, the code includes functions to compute the dynamics generated by the 
      <strong>classical kicked LMG model (classical kicked rotator)</strong>, and its <strong>Lyapunov exponents</strong>. The Lyapunov exponent algorithm is generic and can be applied to any 
      <strong>discrete dynamical system</strong>.

  - title: KrylovQuantumClassical
    description: > 
      A Python and Mathematica implementation of the classical and quantum Lanczos algorithm.
    image: /assets/img/softwares/Lanczos_animation.gif
    github: https://github.com/nicolasdero/KrylovQuantumClassical
    zenodo: https://zenodo.org/records/21337092
    useful: >
      The code contains a generic Mathematica implementation of the <strong>Lanczos algorithm for operators</strong>, using arbitrary-precision arithmetic with both an infinite-temperature 
      inner product and a microcanonical one. It also includes generic functions for studying the <strong>phase transition, spectrum, symmetries and autocorellation functions</strong> of a 
      given Hamiltonian, tailored to the LMG and FP models in this case. The <strong>classical Lanczos algorithm</strong> was designed to be general enough to apply to any collective spin 
      model. In both the quantum and classical cases, the computation of the <strong>Krylov complexity</strong> and its <strong>large-time behavior</strong> remains generic and can be applied 
      to any Lanczos sequence.

  - title: Pydlosky
    description: > 
      A Python implementation of the Pedlosky quasi-geostrophic model.
    image: /assets/img/softwares/trajectory_animation.gif
    github: https://github.com/Climdyn/Pydlosky
    zenodo: https://zenodo.org/records/19452069
    useful: >
      The code contains a Numba-optimized integrator that can be adapted for the <strong>numerical integration</strong> of generic continuous dynamical systems. It is specifically designed 
      to integrate many initial conditions in parallel. It also includes a numerical implementation of the Benettin et al. algorithm for computing the <strong>Lyapunov exponents</strong> 
      of continuous dynamical systems. Overall, the code contains many small functions for the <strong>nonlinear analysis</strong> of dynamical systems. The notebook also provides a good example
       of a <strong>numerical continuation analysis</strong> using the <strong>AUTO software</strong>.