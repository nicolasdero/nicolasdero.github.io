  - title: From phase space to Krylov space, one shell at a time
    authors: <strong>Nicolas De Ro</strong>, Adrián Sánchez-Garrido, Julian Sonner
    conference_short: arXiv
    conference: arXiv:2607.12585, 2026.
    year: 2026
    pdf: https://arxiv.org/pdf/2607.12585
    image: /assets/img/publications/LMG_Lanczos_classic_quantum.png
    page: https://arxiv.org/abs/2607.12585
    summary: >
      How complex is a quantum system, and how can we compare the complexity of different systems? Krylov complexity has recently emerged as a simple and natural measure to answer these 
      questions for the core objects of quantum mechanics: states and operators. An operator is a mathematical instruction that transforms a quantum state or extracts physical information 
      from it. As time passes, these operators evolve, revealing a system's underlying dynamics. By examining the interplay between a chosen operator and the system's total energy engine, 
      the Hamiltonian, an abstract mathematical space known as the Krylov space can be constructed. Krylov complexity quantifies how an operator spreads through this space over time. A 
      natural question is whether this framework can also be applied to non-quantum, classical systems. In this work, we extend the definition of Krylov complexity to classical mechanics 
      and test it on a class of simple quantum systems involving spin degrees of freedom. These systems transit into classical behavior as their spin magnitude grows large. Despite their 
      apparent simplicity, we demonstrate that the inherent symmetries of these systems strictly constrain the dimension of their quantum Krylov space. Finally, we also propose a more 
      refined measure of Krylov complexity by analyzing it within restricted energy windows, at both the classical and quantum levels.

  - title: Revisiting the Dynamical Properties of Pedlosky's Two-Layer Model for Finite Amplitude Baroclinic Waves
    authors: <strong>Nicolas De Ro</strong>, Jonathan Demaeyer, Stéphane Vannitsem
    conference_short: arXiv
    conference: arXiv:2604.14123, 2026.
    year: 2026
    pdf: https://arxiv.org/pdf/2604.14123
    image: /assets/img/publications/highlight_image_bassin.png
    page: https://arxiv.org/abs/2604.14123
    summary: >
      The dynamics of Earth's atmosphere and oceans are governed by equations of motion derived from fundamental physical principles. Observations indicate that atmospheric and oceanic flows 
      are generally time-dependent and highly variable. The emergence of such solutions through instabilities is an essential element of the understanding of large-scale motions. Baroclinic 
      instability originates from the presence of a horizontal temperature gradient in a rotating fluid that is subject to vertical wind shear. The growth of these unstable waves generates 
      storms and influences global atmospheric and ocean circulations. While studying the growth of these waves is a difficult task in the real Earth system, modeling the atmosphere or the 
      ocean as two layers of stratified, rotating fluids offers an insightful framework for investigation, capturing the essential dynamics. Here, we use such a representation, originally 
      proposed by Joseph Pedlosky, to explore the nonlinear growth of finite amplitude baroclinic waves, which exhibit deterministic chaos and other complex features as dissipation is 
      introduced. This study revisits the two-layer model through the lens of modern analytical and numerical techniques allowing for a detailed description of the nature of the solutions 
      generated by the system. Among the key findings, the presence of multiple coexisting attractors with intricate basin boundaries reveals an additional complexity of the system which 
      renders the problem of forecasting much harder.

  - title: Local Equilibrium Approach to Quantum Transport in Normal Fluids
    authors: <strong>Nicolas De Ro</strong>
    conference_short: thesis
    conference: Master's thesis, 2022.
    year: 2022
    pdf: /assets/documents/master_thesis.pdf
    image: /assets/img/publications/picture_master_thesis.png
    page: https://www.researchgate.net/publication/363645602_Local_Equilibrium_Approach_to_Quantum_Transport_in_Normal_Fluids
    summary: >
      From a wood stove warming a room in Winter to a tea bag diffusing in hot water, our world is shaped by movement and change. Transport phenomena encompass the familiar idea that a 
      variation of a thermodynamic quantity — such as temperature or particle density — drives a motion, or more strictly, a flow. A central question in physics is: What is the exact 
      mathematical relation between these thermodynamic forces and the resulting flows? To a first approximation, this relationship is linear, defining what we call transport coefficients. 
      These include known properties such as thermal conductivity, diffusion coefficient, and viscosity. While their definitions are well understood macroscopically. a deeper puzzle remains: 
      Macroscopic transport processes are inherently dissipative, generating entropy and creating an irreversible "arrow of time." This contrasts sharply with the time-reversal symmetry of 
      the microscopic laws of quantum mechanics. In this work, we derive the Green–Kubo formulas, which define these macroscopic transport coefficients directly in terms of microscopic 
      quantities derived from quantum-mechanical first principles. To achieve this, we use the local equilibrium approach, describing a system that is globally out of equilibrium while 
      remaining in thermodynamic equilibrium at every local point. 
